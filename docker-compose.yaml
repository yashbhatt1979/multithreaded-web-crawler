services:

  # =======================================================
  # REDIS
  # =======================================================

  redis:
    image: redis:7-alpine
    container_name: crawler-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


  # =======================================================
  # MYSQL
  # =======================================================

  mysql:
    image: mysql:8.0
    container_name: crawler-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: crawler
      MYSQL_ROOT_PASSWORD: Yogeshbhatt@2003

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p'Yogeshbhatt@2003' --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s


  # =======================================================
  # CRAWLER INSTANCE 1
  # =======================================================

  crawler-1:
    build: .
    container_name: crawler-1
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      DB_URL: jdbc:mysql://mysql:3306/crawler
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

    depends_on:
      redis:
        condition: service_started

      mysql:
        condition: service_healthy


  # =======================================================
  # CRAWLER INSTANCE 2
  # =======================================================

  crawler-2:
    build: .
    container_name: crawler-2
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      DB_URL: jdbc:mysql://mysql:3306/crawler
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

    depends_on:
      redis:
        condition: service_started

      mysql:
        condition: service_healthy


  # =======================================================
  # CRAWLER INSTANCE 3
  # =======================================================

  crawler-3:
    build: .
    container_name: crawler-3
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      DB_URL: jdbc:mysql://mysql:3306/crawler
      DB_USERNAME: root
      DB_PASSWORD: Yogeshbhatt@2003

    depends_on:
      redis:
        condition: service_started

      mysql:
        condition: service_healthy


  # =======================================================
  # NGINX LOAD BALANCER
  # =======================================================

  nginx:
    image: nginx:alpine
    container_name: crawler-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      crawler-1:
        condition: service_started

      crawler-2:
        condition: service_started

      crawler-3:
        condition: service_started


# =========================================================
# VOLUMES
# =========================================================

volumes:

  redis_data:

  mysql_data: