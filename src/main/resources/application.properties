# ==========================================
# Application
# ==========================================

spring.application.name=multithreaded-web-crawler

server.port=8080


# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/web_crawler

spring.datasource.username=root

spring.datasource.password=Yogeshbhatt@2003

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Flyway
# ==========================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration


# ==========================================
# Logging
# ==========================================

logging.level.com.crawler=INFO

# ==========================================
# Crawler Configurations
# ==========================================

# crawler.max-depth=3
# crawler.max-pages=100
crawler.request-timeout-seconds=10
crawler.user-agent=Java-Web-Crawler/1.0